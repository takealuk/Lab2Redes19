frr defaults traditional
hostname r5
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r2:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r3:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r4:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r6:
interface eth3
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Prefijos publicos de B que queremos anunciar mediante OSPF:
ip prefix-list PUBLICOS_B permit 203.0.113.1/32
ip prefix-list PUBLICOS_B permit 203.0.113.8/30
!
! Permitir compartir solo las rutas incluidas en PUBLICOS_B:
route-map ANUNCIAR_B permit 1
    match ip address prefix-list PUBLICOS_B
!
! Identificador unico de r5 dentro de OSPF:
router ospf
    ospf router-id 5.5.5.5
    redistribute kernel route-map ANUNCIAR_B
!
