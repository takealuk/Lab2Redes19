frr defaults traditional
hostname r3
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r1:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r2:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r5:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Anuncia la red publica de A sin formar vecinos OSPF con rcla:
interface eth3
    ip ospf area 0.0.0.0
    ip ospf passive
!
! Identificador unico de r3 dentro de OSPF:
router ospf
    ospf router-id 3.3.3.3
!
