frr defaults traditional
hostname r4
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r2:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r5:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r6:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r7:
interface eth3
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Identificador unico de r4 dentro de OSPF:
router ospf
    ospf router-id 4.4.4.4
!
