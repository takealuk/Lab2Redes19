frr defaults traditional
hostname r7
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r4:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 5
!
! Configuracion OSPF del enlace hacia r8:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 5
!
! Identificador unico de r7 dentro de OSPF:
router ospf
    ospf router-id 7.7.7.7
!