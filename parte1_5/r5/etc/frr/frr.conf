frr defaults traditional
hostname r5
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r2:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 5
!
! Configuracion OSPF del enlace hacia r3:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 2
!
! Configuracion OSPF del enlace hacia r4:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 5
!
! Configuracion OSPF del enlace hacia r6:
interface eth3
    ip ospf area 0.0.0.0
    ip ospf cost 2
!
! Rutas hacia los destinos publicos de B a traves de rclb:
ip route 203.0.113.1/32 203.0.113.6
ip route 203.0.113.8/30 203.0.113.6
!
! Identificador unico de r5 dentro de OSPF:
router ospf
    ospf router-id 5.5.5.5
    redistribute static
!
