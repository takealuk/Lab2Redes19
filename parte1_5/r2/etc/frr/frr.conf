frr defaults traditional
hostname r2
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r1:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 1
!
! Configuracion OSPF del enlace hacia r3:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 5
!
! Configuracion OSPF del enlace hacia r4:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 1
!
! Configuracion OSPF del enlace hacia r5:
interface eth3
    ip ospf area 0.0.0.0
    ip ospf cost 5
!
! Identificador unico de r2 dentro de OSPF:
router ospf
    ospf router-id 2.2.2.2
!