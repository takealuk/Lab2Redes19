frr defaults traditional
hostname r6
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r4:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r5:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Identificador unico de r6 dentro de OSPF:
router ospf
    ospf router-id 6.6.6.6
    ! Anuncia la salida por defecto:
    default-information originate
!
