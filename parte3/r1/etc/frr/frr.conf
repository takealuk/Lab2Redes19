frr defaults traditional
hostname r1
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r2:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r3:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Identificador unico de r1 dentro de OSPF:
router ospf
    ospf router-id 1.1.1.1
    ! Anuncia la salida por defecto:
    default-information originate
!