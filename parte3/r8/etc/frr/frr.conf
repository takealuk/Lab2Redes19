frr defaults traditional
hostname r8
log file /var/log/frr/frr.log
!
! Configuracion OSPF del enlace hacia r6:
interface eth0
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Configuracion OSPF del enlace hacia r7:
interface eth1
    ip ospf area 0.0.0.0
    ip ospf cost 10
!
! Anuncia la red publica del cliente nuevo sin formar vecinos OSPF con pcc1:
interface eth2
    ip ospf area 0.0.0.0
    ip ospf passive
!
! Identificador unico de r8 dentro de OSPF:
router ospf
    ospf router-id 8.8.8.8
!
